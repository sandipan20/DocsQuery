# ============================================================
# DocsQuery - Python Project Configuration
# ============================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docsquery"
version = "0.1.0"
description = "Production-oriented domain-specific RAG system"
readme = "README.md"
requires-python = ">=3.12,<3.13"

authors = [
    { name = "Sandipan" },
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "pypdf>=5.0,<7.0",
    "rank-bm25>=0.2,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "transformers>=4.0,<6.0",
    "torch>=2.0,<3.0",
    "qdrant-client>=1.12,<2.0",
    "google-genai>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
